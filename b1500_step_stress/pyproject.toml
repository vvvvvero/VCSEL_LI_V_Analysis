[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b1500_step_stress"
version = "1.0.0"
description = "Step stress measurement with Keysight B1500 Semiconductor Parameter Analyzer and Thorlabs optical power meter"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Veronica Gao Zhan", email = "veronicagaozhan@gmail.com"}]
keywords = ["keysight", "b1500", "thorlabs", "power meter", "iv curve", "stress test", "vcsel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20.0",
    "pyvisa>=1.11.0",
    "pyvisa-py>=0.5.0",
    "PyQt5>=5.15.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black>=21.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/vvvvvero/VCSEL_LI_V_Analysis"
Documentation = "https://github.com/vvvvvero/VCSEL_LI_V_Analysis"
Repository = "https://github.com/vvvvvero/VCSEL_LI_V_Analysis.git"
Issues = "https://github.com/vvvvvero/VCSEL_LI_V_Analysis/issues"

[project.scripts]
b1500_step_stress = "b1500_step_stress.__main__:main"

[tool.setuptools]
packages = ["b1500_step_stress"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
